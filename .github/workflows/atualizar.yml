name: Atualizar painel

on:
  schedule:
    - cron: '30 9 * * 1-6'   # segunda a sábado, 6h30 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'pipeline/**', 'raw/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Coletar LOA (SIOP)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/coleta_siop.py

      - name: Coletar emendas (Portal da Transparência)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/coleta_emendas.py

      - name: Coletar partidos (Câmara e Senado)
        if: github.event_name != 'push'
        continue-on-error: true
        run: python pipeline/coleta_parlamentares.py

      - name: Montar o site
        run: python pipeline/montar.py

      - name: Guardar os dados novos no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "Atualização automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw
          if git diff --cached --quiet; then
            echo "Sem dados novos."
          else
            git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
